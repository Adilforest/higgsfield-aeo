# Entity config for mention detection and citation attribution.
# Aliases are matched as whole words, case-insensitive. Avoid generic words
# ("captions", "pencil", "flow") as bare aliases: they create false positives.
# The name itself is matched only when no aliases are given.

target:
  name: Higgsfield
  aliases: ["Higgsfield", "Higgsfield AI", "Higgsfield.ai"]
  domains: ["higgsfield.ai"]

